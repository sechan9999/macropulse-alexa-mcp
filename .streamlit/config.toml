# The app's CSS paints a dark background; without a dark base theme Streamlit draws labels, captions,
# inputs and Plotly titles/legends in light-theme greys, which are hard to read on it.
[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#050810"
secondaryBackgroundColor = "#0f172a"
textColor = "#e2e8f0"
